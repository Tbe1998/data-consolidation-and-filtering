name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python -m py_compile scripts/*.py examples/demo.py tests/*.py
      - name: install deps for delivery smoke
        run: python -m pip install openpyxl pillow
      - name: preflight (route A)
        run: python scripts/preflight.py --route A
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke run
        run: |
          python scripts/long_to_wide.py examples/sample_long.csv /tmp/wide.csv
          python examples/demo.py
          test -s /tmp/wide.csv
          python scripts/verify_delivery.py --help > /dev/null
          python scripts/preflight.py --route C --json > /tmp/preflight.json || true
          python -c "import json;json.load(open('/tmp/preflight.json'))"
