name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python -m py_compile scripts/*.py examples/demo.py tests/*.py
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke run
        run: |
          python scripts/long_to_wide.py examples/sample_long.csv /tmp/wide.csv
          python examples/demo.py
          test -s /tmp/wide.csv
